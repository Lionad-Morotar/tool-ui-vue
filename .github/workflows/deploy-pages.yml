name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - main

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build landing page
        run: pnpm site:build

      - name: Build Histoire docs
        run: pnpm story:build

      - name: Merge Histoire into landing page
        run: |
          mkdir -p packages/site/.output/public/docs
          cp -r dist-histoire/* packages/site/.output/public/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
